<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="https://openweathermap.org/img/wn/04d@2x.png">
</head>
<body>

    <div class="weather-app">
        <div class="weather-app__sidebar">
            <div class="weather-app__info">
                <h2 class="weather-app__day">Friday</h2>
                <span class="weather-app__date">8 August 2025</span>
                <div class="weather-app__icon-section">
                    <div class="weather-app__loader"></div>
                </div>
                <div class="weather-app__temp-conversion">
                    <button class="weather-app__temp-btn active" data-unit="celsius">°C</button>
                    <button class="weather-app__temp-btn" data-unit="fahrenheit">°F</button>
                </div>
            </div>
        </div>
        <div class="weather-app__main-content">
            <form class="weather-app__search-form">
                <input type="text" placeholder="Search for a city..." class="weather-app__input">
                <button type="submit" class="weather-app__search-btn">Search</button>
            </form>

            <div class="weather-app__details">
                <div class="weather-app__details-row">
                    <p class="weather-app__details-label">Location</p>
                    <span class="weather-app__details-value" data-id="location"></span>
                </div>
                <div class="weather-app__details-row">
                    <p class="weather-app__details-label">Temperature</p>
                    <span class="weather-app__details-value" data-id="temp"></span>
                </div>
                <div class="weather-app__details-row">
                    <p class="weather-app__details-label">Humidity</p>
                    <span class="weather-app__details-value" data-id="humidity"></span>
                </div>
                <div class="weather-app__details-row">
                    <p class="weather-app__details-label">Wind Speed</p>
                    <span class="weather-app__details-value" data-id="wind"></span>
                </div>
            </div>

            <div class="weather-app__forecast">
                <ul class="weather-app__forecast-list"></ul>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
